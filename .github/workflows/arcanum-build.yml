name: Arcanum Build Check

on:
  push:
    branches:
      - feature/arcanum-archive-v0.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Test source importer
        run: npm run arcanum:import -- "import/source-files.example.json"

      - name: Verify native parser modules
        run: node -e "Promise.all([import('pdfjs-dist/legacy/build/pdf.mjs'), import('pdf-parse'), import('mammoth')]).then(() => console.log('Native PDF/DOCX parsers ready'))"

      - name: Test source extraction engine
        run: npm run arcanum:extract -- --root "import/extraction-fixture" --manifest "import/extraction-fixture/source-manifest.json" --output "public/arcanum/extracted-test"

      - name: Verify extraction outputs
        run: |
          test -f public/arcanum/extracted-test/text/fixture-text-01.txt
          test -f public/arcanum/extracted-test/assets/fixture-image-01.svg
          test -f public/arcanum/extraction-report.json

      - name: Build Arcanum Archive
        run: npm run build
